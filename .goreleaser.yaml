---
project_name: pmtop

builds:
  - id: pmtop-cli
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/pmtop
    binary: pmtop
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: pmtop-gui
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    goos:
      - windows
    goarch:
      - amd64
    main: ./cmd/pmtop-gui
    binary: pmtop-gui
    ldflags:
      - -s -w -H=windowsgui


archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "pmtop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
